<main class="checkout-page">
    <span class="eyebrow">SECURE PAYMENT</span>
    <h2>Metode Pembayaran</h2>
    <p>Pilih metode pembayaran yang tersedia.</p>

    <div class="checkout-form">
        <div id="payment-summary"></div>

        <form id="payment-form">
            <label>
                <input type="radio" name="metode" value="Transfer Bank" required>
                Transfer Bank
            </label>

            <label>
                <input type="radio" name="metode" value="QRIS">
                QRIS
            </label>

            <label>
                <input type="radio" name="metode" value="COD">
                COD (Bayar di Tempat)
            </label>

            <button type="submit" class="btn">Konfirmasi Pesanan</button>
        </form>
    </div>
</main>
