<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PIXIEQUE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
    <a href="index.html" class="brand">
        <h1 class="logo">PIXIEQUE</h1>
        <p>Make Every Moment Special</p>
    </a>
    <nav>
        <a href="index.html">Beranda</a>
        <a href="toko.html">Toko</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="kontak.html">Kontak</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="pesanan.html">Pesanan Saya</a>
    </nav>
</header>

<main class="checkout-page">
    <span class="eyebrow">PIXIEQUE ORDER</span>
    <h2>Checkout Pesanan</h2>
    <p>Lengkapi informasi pengiriman pesananmu.</p>

    <form id="checkout-form" class="checkout-form">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan nama lengkap">

        <label>Nomor HP</label>
        <input type="tel" id="telepon" required placeholder="Masukkan nomor HP">

        <label>Alamat Lengkap</label>
        <textarea id="alamat" required placeholder="Masukkan alamat lengkap"></textarea>

        <label>Catatan Pesanan</label>
        <textarea id="catatan" placeholder="Catatan tambahan (opsional)"></textarea>

        <h3>Ringkasan Belanja</h3>
        <div id="checkout-summary"></div>
        <h3>Total: <span id="checkout-total">Rp0</span></h3>

        <button type="submit" class="btn">Lanjut ke Pembayaran</button>
    </form>
</main>

<footer>
    <p>© 2026 PIXIEQUE | Make Every Moment Special</p>
</footer>
<script src="script.js"></script>
</body>
</html>
